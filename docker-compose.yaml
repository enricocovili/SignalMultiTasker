services:
  signal-api:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: signal-api
    networks:
      - signal-network
    environment:
      MODE: normal # supported modes: json-rpc, native, normal
      # AUTO_RECEIVE_SCHEDULE: "0 22 * * *" # enable this parameter on demand
    volumes:
      - "./signal-cli-config:/home/.local/share/signal-cli"
    restart: unless-stopped

  email-bridge:
    build: .
    container_name: email-bridge
    networks:
      - signal-network
    # Public resolvers as a fallback: the IMAP host and the LLM/Whisper
    # providers are resolved on every call, so a flaky host resolver would
    # otherwise stall the bridge.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - signal-api
    # Map form (not the `- KEY=value` list) so the prompts below can be YAML
    # block scalars: their {subject}/{body} placeholders would otherwise be
    # mangled by compose's ${...} interpolation.
    environment:
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      SIGNAL_SENDER: ${SIGNAL_SENDER}
      SIGNAL_GROUP_ID: ${SIGNAL_GROUP_ID}
      SIGNAL_API_BASE: http://signal-api:8080
      SIGNAL_DEVICE_NAME: ${SIGNAL_DEVICE_NAME:-signal-multitasker}
      SIGNAL_POLL_INTERVAL: ${SIGNAL_POLL_INTERVAL:-10}
      EMAIL_POLL_INTERVAL: ${EMAIL_POLL_INTERVAL:-180}
      MAX_NEW_EMAILS: ${MAX_NEW_EMAILS:-10}
      STATE_FILE: /app/state/email_state.json
      IMAP_TIMEOUT: ${IMAP_TIMEOUT:-60}
      MAX_CONSECUTIVE_FAILURES: ${MAX_CONSECUTIVE_FAILURES:-10}
      FAILURE_BACKOFF_MAX: ${FAILURE_BACKOFF_MAX:-300}

      # ── LLM summariser ────────────────────────────────────────────────────
      # Any OpenAI-compatible chat-completions provider. LLM_URL is the API
      # base (the part ending in /v1); the bridge appends /chat/completions.
      # Summaries are on by default for every forwarded email and voice note;
      # if the provider is unreachable, emails fall back to a body excerpt.
      # Keys live in .env, never here.
      LLM_URL: ${LLM_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-180}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      # ~160 tokens is comfortably more than the 2 sentences we ask for.
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-160}
      LLM_MAX_INPUT_CHARS: ${LLM_MAX_INPUT_CHARS:-4000}

      # The sender is never asked of the model — it is parsed deterministically
      # from the From header — so the prompt only has to yield the intention.
      # Placeholders: {subject}, {body}.
      EMAIL_SUMMARY_PROMPT: |-
        You summarise emails for a notification bot.
        In AT MOST 2 short sentences, state what the email is about and what it asks the reader to do (if anything).
        Rules: write in the same language as the email; do not mention or guess the sender; do not greet, introduce yourself or add any preamble; no bullet points, no markdown, no quotes. Output only the summary.

        Subject: {subject}

        Body:
        {body}
      # Placeholder: {body} (the transcript).
      VOICE_SUMMARY_PROMPT: |-
        You summarise voice messages for a notification bot.
        In AT MOST 2 short sentences, state what the speaker says and what they ask for (if anything).
        Rules: write in the same language as the transcript; do not greet, introduce yourself or add any preamble; no bullet points, no markdown, no quotes. Output only the summary.

        Transcript:
        {body}

      # ── Speech-to-text ────────────────────────────────────────────────────
      # Any OpenAI-compatible audio-transcriptions provider. WHISPER_URL is the
      # API base; the bridge appends /audio/transcriptions.
      WHISPER_URL: ${WHISPER_URL:-https://api.openai.com/v1}
      WHISPER_API_KEY: ${WHISPER_API_KEY:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-whisper-1}
      # Empty = let the provider auto-detect the spoken language.
      WHISPER_LANG: ${WHISPER_LANG:-}
      WHISPER_TIMEOUT: ${WHISPER_TIMEOUT:-600}
      VOICE_INCLUDE_TRANSCRIPT: ${VOICE_INCLUDE_TRANSCRIPT:-false}
    volumes:
      - "./bridge_state:/app/state"
    # unless-stopped, not on-failure: on-failure does NOT bring the container
    # back after a host reboot or Docker daemon restart, which silently killed
    # the bridge for 11 days.
    restart: unless-stopped

networks:
  signal-network:
    driver: bridge
